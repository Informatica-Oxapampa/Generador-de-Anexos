# Validación de código, publicación e instalador sin credenciales de firma.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  pruebas-portables:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Preparar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar pruebas
        run: |
          dotnet restore tests/GeneradorAnexos.Domain.Tests/GeneradorAnexos.Domain.Tests.csproj
          dotnet restore tests/OrderPdfReader.Regression/OrderPdfReader.Regression.csproj

      - name: Pruebas de dominio, pagos y sincronización
        run: dotnet run --project tests/GeneradorAnexos.Domain.Tests/GeneradorAnexos.Domain.Tests.csproj -c Release --no-restore

      - name: Integración de datos, documentos y actualizaciones
        run: dotnet run --project tests/GeneradorAnexos.Integration.Tests -c Release

      - name: Actualización sin certificado y validaciones de descarga
        run: dotnet run --project tests/GeneradorAnexos.Updater.Tests -c Release

      - name: Regresión del lector PDF
        run: dotnet run --project tests/OrderPdfReader.Regression/OrderPdfReader.Regression.csproj -c Release --no-restore

  compilacion-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Preparar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Validar integración con DPAPI real
        shell: pwsh
        run: |
          dotnet run --project tests/GeneradorAnexos.Integration.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas de integración.' }

      - name: Compilar Debug y publicar Release
        shell: pwsh
        run: |
          $proyecto = 'src/GeneradorAnexos.WinUI/GeneradorAnexos.WinUI.csproj'
          dotnet build $proyecto -c Debug -r win-x64 --self-contained true -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Falló Debug.' }
          dotnet publish $proyecto -c Release -r win-x64 --self-contained true -p:Platform=x64 -o publicado
          if ($LASTEXITCODE -ne 0) { throw 'Falló Release.' }
          ./scripts/validar-publicado.ps1

      - name: Incluir Visual C++ y compilar el instalador
        shell: pwsh
        run: |
          ./scripts/preparar-vcredist.ps1
          $iscc = ./scripts/preparar-inno.ps1
          & $iscc /Q /DExigirVcRedist instalador/GeneradorAnexos.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falló el instalador.' }

      - name: Conservar instalador para validación en un equipo de pruebas
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node.js 24
        with:
          name: instalador-pruebas-sin-firma-${{ github.sha }}
          path: instalador/salida/GeneradorAnexos-*-Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

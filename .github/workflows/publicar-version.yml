name: Preparar Release con actualizaciones
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preparar-release
  cancel-in-progress: false
jobs:
  validar:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  preparar:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Preparar publicación del programa o de las plantillas
        run: python3 scripts/publicar-release.py
